<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Notion Pomodoro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      /* Light botanical base */
      --bg:#fbfaf7;                 /* crema clarita */
      --panel:#ffffff;              /* tarjetas */
      --text:#2b2b2b;
      --muted:#6f6f78;

      /* Purple accents (ring + background design) */
      --accent:#a855f7;
      --accent2:#7c3aed;

      /* Ring track + glow */
      --ringTrack: rgba(60, 36, 92, .10);
      --glow: rgba(168,85,247,.12);

      /* Daisy cream */
      --daisy:#FFFAD6;
      --daisy2:#F6C7FF;

      /* Congrats tint */
      --good: rgba(34,197,94,.12);
      --goodBorder: rgba(34,197,94,.26);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:
  radial-gradient(1000px 600px at 18% 18%, rgba(168,85,247,.30), transparent 55%),
  radial-gradient(900px 620px at 82% 28%, rgba(124,58,237,.24), transparent 62%),
  radial-gradient(1100px 700px at 52% 92%, rgba(168,85,247,.20), transparent 60%),
  linear-gradient(180deg, rgba(168,85,247,.08), transparent 45%),
  var(--bg);
      color:var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display:grid;
      place-items:center;
      height:100vh;
      overflow:hidden;
    }

    .app{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:22px;
      padding:24px;
      width:min(920px, 100%);
      position:relative;
      z-index:2;
    }

    .topline{
      display:flex;
      align-items:center;
      justify-content:space-between;
      width:min(720px, 100%);
      gap:12px;
      flex-wrap:wrap;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:14px;
      background:rgba(255,255,255,.82);
      border:1px solid rgba(40, 30, 60, .10);
      backdrop-filter: blur(10px);
      color:var(--muted);
      font-size:13px;
      box-shadow: 0 12px 40px rgba(0,0,0,.05);
    }

    .badge{
      width:10px;height:10px;border-radius:50%;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow:0 0 0 6px var(--glow);
    }

    .pill strong{ color: var(--text); font-weight:650; }

    .goalWrap{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .goalInput{
      width:70px;
      padding:8px 10px;
      border-radius:12px;
      background:rgba(255,255,255,.9);
      border:1px solid rgba(40, 30, 60, .12);
      color:var(--text);
      outline:none;
      font-size:13px;
      text-align:center;
      box-shadow: 0 10px 28px rgba(0,0,0,.04);
    }

    .ring{
      width:360px;
      height:360px;
      border-radius:50%;
      background:
        conic-gradient(var(--accent) calc(var(--progress) * 1turn), var(--ringTrack) 0);
      display:grid;
      place-items:center;
      box-shadow: 0 0 0 14px var(--glow) inset;
      transition: background 200ms linear, box-shadow 200ms ease;
    }

    .inner{
      width:300px;
      height:300px;
      border-radius:50%;
      background:rgba(255,255,255,.92);
      border:1px solid rgba(40, 30, 60, .10);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      box-shadow: 0 30px 70px rgba(0,0,0,.10);
      backdrop-filter: blur(10px);
      position:relative;
    }

    .time{
      font-size:74px;
      font-weight:750;
      letter-spacing:.5px;
      line-height:1;
    }

    .sub{
      margin-top:10px;
      color:var(--muted);
      font-size:14px;
    }

    .controls{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
    }

    button{
      background:rgba(255,255,255,.86);
      border:1px solid rgba(40, 30, 60, .12);
      color:var(--text);
      padding:10px 16px;
      border-radius:14px;
      cursor:pointer;
      font-size:14px;
      min-width:92px;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 38px rgba(0,0,0,.05);
      transition: transform .06s ease, opacity .2s ease;
    }
    button:active{ transform: translateY(1px); }
    button:hover{ opacity:.92; }

    button.primary{
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      border:none;
      color:#fff;
      box-shadow:0 14px 34px rgba(124,58,237,.18);
    }

    .hint{
      color:var(--muted);
      font-size:12px;
      margin-top:4px;
      opacity:.9;
      text-align:center;
    }

    /* Toast */
    .toast{
      position:fixed;
      top:18px;
      left:50%;
      transform:translateX(-50%);
      padding:12px 14px;
      border-radius:14px;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(40, 30, 60, .12);
      color:var(--text);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,.10);
      opacity:0;
      pointer-events:none;
      transition: opacity .25s ease, transform .25s ease;
      display:flex;
      align-items:center;
      gap:10px;
      z-index:9999;
      max-width:min(520px, calc(100vw - 24px));
    }
    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(6px);
    }
    .toast.good{
      border-color: var(--goodBorder);
      background: linear-gradient(0deg, var(--good), rgba(255,255,255,.88));
    }

    .toast .dot{
      width:10px;height:10px;border-radius:50%;
      background:rgba(34,197,94,.9);
      box-shadow:0 0 0 6px rgba(34,197,94,.15);
    }

    /* Daisy layer */
    .daisy-layer{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
    }

    .daisy{
  position:absolute;
  width:280px;
  height:280px;
  opacity:.78;
  transform-origin: 50% 50%;
  filter: drop-shadow(0 18px 34px rgba(124,58,237,.10));
}
    .daisy .petals ellipse{
      fill: var(--daisy);
      stroke: rgba(120, 90, 160, .09);
      stroke-width: 1.5;
    }

    .daisy .center{
      fill: var(--daisy2);
      opacity:.85;
    }

    /* positions */
.d1{ top:-70px; left:-70px; transform: rotate(-12deg); width:340px; height:340px; }
.d2{ bottom:-90px; right:-90px; transform: rotate(18deg); width:380px; height:380px; opacity:.65; }
.d3{ top:10px; right:-110px; transform: rotate(8deg); width:260px; height:260px; opacity:.55; }
.d4{ bottom:0px; left:-120px; transform: rotate(-6deg); width:280px; height:280px; opacity:.52; }

    /* Animations ONLY when running */
    @keyframes floaty {
      0%   { transform: translate(0,0) rotate(var(--r)); }
      50%  { transform: translate(0,-10px) rotate(calc(var(--r) + 3deg)); }
      100% { transform: translate(0,0) rotate(var(--r)); }
    }

    @keyframes petalWiggle {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    body.running .d1{ --r:-12deg; animation: floaty 3.6s ease-in-out infinite; }
    body.running .d2{ --r:18deg;  animation: floaty 4.4s ease-in-out infinite; }
    body.running .d3{ --r:8deg;   animation: floaty 3.9s ease-in-out infinite; }
    body.running .d4{ --r:-6deg;  animation: floaty 4.7s ease-in-out infinite; }

    body.running .daisy .petals{
      animation: petalWiggle 1.8s ease-in-out infinite;
    }

    @media (max-width: 460px){
      .ring{ width:320px; height:320px; }
      .inner{ width:270px; height:270px; }
      .time{ font-size:64px; }
    }
  </style>
</head>

<body>
  <!-- Daisy layer -->
  <div class="daisy-layer" aria-hidden="true">
    <svg class="daisy d1" viewBox="0 0 120 120">
      <g>
        <circle cx="60" cy="60" r="16" class="center"/>
        <g class="petals">
          <ellipse cx="60" cy="18" rx="10" ry="18"/>
          <ellipse cx="60" cy="102" rx="10" ry="18"/>
          <ellipse cx="18" cy="60" rx="18" ry="10"/>
          <ellipse cx="102" cy="60" rx="18" ry="10"/>
          <ellipse cx="32" cy="32" rx="12" ry="18" transform="rotate(-45 32 32)"/>
          <ellipse cx="88" cy="32" rx="12" ry="18" transform="rotate(45 88 32)"/>
          <ellipse cx="32" cy="88" rx="12" ry="18" transform="rotate(45 32 88)"/>
          <ellipse cx="88" cy="88" rx="12" ry="18" transform="rotate(-45 88 88)"/>
        </g>
      </g>
    </svg>

    <svg class="daisy d2" viewBox="0 0 120 120">
      <g>
        <circle cx="60" cy="60" r="14" class="center"/>
        <g class="petals">
          <ellipse cx="60" cy="18" rx="9" ry="16"/>
          <ellipse cx="60" cy="102" rx="9" ry="16"/>
          <ellipse cx="18" cy="60" rx="16" ry="9"/>
          <ellipse cx="102" cy="60" rx="16" ry="9"/>
          <ellipse cx="34" cy="34" rx="11" ry="16" transform="rotate(-45 34 34)"/>
          <ellipse cx="86" cy="34" rx="11" ry="16" transform="rotate(45 86 34)"/>
          <ellipse cx="34" cy="86" rx="11" ry="16" transform="rotate(45 34 86)"/>
          <ellipse cx="86" cy="86" rx="11" ry="16" transform="rotate(-45 86 86)"/>
        </g>
      </g>
    </svg>

    <svg class="daisy d3" viewBox="0 0 120 120">
      <g>
        <circle cx="60" cy="60" r="13" class="center"/>
        <g class="petals">
          <ellipse cx="60" cy="18" rx="8" ry="15"/>
          <ellipse cx="60" cy="102" rx="8" ry="15"/>
          <ellipse cx="18" cy="60" rx="15" ry="8"/>
          <ellipse cx="102" cy="60" rx="15" ry="8"/>
          <ellipse cx="34" cy="34" rx="10" ry="15" transform="rotate(-45 34 34)"/>
          <ellipse cx="86" cy="34" rx="10" ry="15" transform="rotate(45 86 34)"/>
          <ellipse cx="34" cy="86" rx="10" ry="15" transform="rotate(45 34 86)"/>
          <ellipse cx="86" cy="86" rx="10" ry="15" transform="rotate(-45 86 86)"/>
        </g>
      </g>
    </svg>

    <svg class="daisy d4" viewBox="0 0 120 120">
      <g>
        <circle cx="60" cy="60" r="13" class="center"/>
        <g class="petals">
          <ellipse cx="60" cy="18" rx="8" ry="15"/>
          <ellipse cx="60" cy="102" rx="8" ry="15"/>
          <ellipse cx="18" cy="60" rx="15" ry="8"/>
          <ellipse cx="102" cy="60" rx="15" ry="8"/>
          <ellipse cx="34" cy="34" rx="10" ry="15" transform="rotate(-45 34 34)"/>
          <ellipse cx="86" cy="34" rx="10" ry="15" transform="rotate(45 86 34)"/>
          <ellipse cx="34" cy="86" rx="10" ry="15" transform="rotate(45 34 86)"/>
          <ellipse cx="86" cy="86" rx="10" ry="15" transform="rotate(-45 86 86)"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="toast" id="toast">
    <span class="dot"></span>
    <span id="toastText">Congrats!</span>
  </div>

  <div class="app">
    <div class="topline">
      <div class="pill">
        <span class="badge"></span>
        <span id="modeLabel">Focus</span>
        <span id="planLabel">35 / 10 (long 30 every 5)</span>
      </div>

      <div class="pill goalWrap">
        <span>Daily goal</span>
        <input class="goalInput" id="goalInput" type="number" min="1" max="30" step="1" />
        <span style="opacity:.9">pomos</span>
      </div>

      <div class="pill">
        <span id="countLabel">Pomodoros: 0</span>
      </div>
    </div>

    <div class="ring" id="ring" style="--progress:0">
      <div class="inner">
        <div class="time" id="time">35:00</div>
        <div class="sub" id="sub">(next break: 10m)</div>
      </div>
    </div>

    <div class="controls">
      <button class="primary" id="startPause">Start</button>
      <button id="stop">Stop</button>
      <button id="skip">Skip</button>
      <button id="reset">Reset</button>
    </div>

    <div class="hint">
      Start/Pause mantiene el tiempo. Stop detiene y vuelve al inicio del bloque actual.
    </div>
  </div>

  <script>
    // === Config ===
    const FOCUS_MIN = 35;
    const SHORT_BREAK_MIN = 10;
    const LONG_BREAK_MIN = 30;
    const LONG_EVERY = 5; // cada 5 pomodoros

    // Goal persistence (simple): localStorage
    const GOAL_KEY = "pomo_daily_goal";
    const GOAL_CONGRATS_KEY = "pomo_goal_congrats_shown"; // per session until Reset

    // === State ===
    let mode = "focus"; // "focus" | "break"
    let pomoCount = 0;  // focus blocks terminados
    let total = FOCUS_MIN * 60;
    let remaining = total;
    let timer = null;
    let lastTick = null;

    // === Elements ===
    const timeEl = document.getElementById("time");
    const ringEl = document.getElementById("ring");
    const modeLabel = document.getElementById("modeLabel");
    const countLabel = document.getElementById("countLabel");
    const subEl = document.getElementById("sub");
    const startPauseBtn = document.getElementById("startPause");
    const goalInput = document.getElementById("goalInput");
    const toast = document.getElementById("toast");
    const toastText = document.getElementById("toastText");

    function setRunning(isRunning){
      document.body.classList.toggle("running", !!isRunning);
    }

    function fmt(sec){
      const m = Math.floor(sec / 60).toString().padStart(2,"0");
      const s = Math.floor(sec % 60).toString().padStart(2,"0");
      return `${m}:${s}`;
    }

    function getNextBreakMinutes(nextPomoCount){
      return (nextPomoCount % LONG_EVERY === 0) ? LONG_BREAK_MIN : SHORT_BREAK_MIN;
    }

    function currentGoal(){
      const g = Number(goalInput.value || 0);
      return (Number.isFinite(g) && g > 0) ? g : 8;
    }

    function showToast(message){
      toastText.textContent = message;
      toast.classList.add("show","good");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => {
        toast.classList.remove("show");
      }, 3200);
    }

    function maybeCongrats(){
      const goal = currentGoal();
      if(pomoCount >= goal){
        const already = localStorage.getItem(GOAL_CONGRATS_KEY) === "1";
        if(!already){
          localStorage.setItem(GOAL_CONGRATS_KEY, "1");
          showToast(`Congrats! 🎉 Goal reached: ${pomoCount}/${goal}`);
          ringEl.style.boxShadow = "0 0 0 14px rgba(34,197,94,.16) inset";
        }
      }
    }

    function setMode(newMode){
      mode = newMode;

      if(mode === "focus"){
        total = FOCUS_MIN * 60;
        remaining = total;
        modeLabel.textContent = "Focus";
        subEl.textContent = `(next break: ${getNextBreakMinutes(pomoCount + 1)}m)`;
      }else{
        const mins = (pomoCount % LONG_EVERY === 0 && pomoCount !== 0) ? LONG_BREAK_MIN : SHORT_BREAK_MIN;
        total = mins * 60;
        remaining = total;
        modeLabel.textContent = mins === LONG_BREAK_MIN ? "Long Break" : "Break";
        subEl.textContent = `(next focus: ${FOCUS_MIN}m)`;
      }
      render();
    }

    function render(){
      timeEl.textContent = fmt(remaining);
      const progress = 1 - (remaining / total);
      ringEl.style.setProperty("--progress", isFinite(progress) ? Math.max(0, Math.min(1, progress)) : 0);
      countLabel.innerHTML = `Pomodoros: <strong>${pomoCount}</strong> / <strong>${currentGoal()}</strong>`;
      startPauseBtn.textContent = timer ? "Pause" : "Start";
    }

    function stopTimer(){
      clearInterval(timer);
      timer = null;
      lastTick = null;
      setRunning(false);
      render();
    }

    function startTimer(){
      if(timer) return;

      setRunning(true);

      // delta-time so it doesn't drift
      lastTick = Date.now();
      timer = setInterval(() => {
        const now = Date.now();
        const delta = Math.floor((now - lastTick) / 1000);
        if(delta >= 1){
          remaining -= delta;
          lastTick += delta * 1000;
        }

        if(remaining <= 0){
          remaining = 0;
          render();
          stopTimer();

          if(mode === "focus"){
            pomoCount += 1;
            maybeCongrats();
            setMode("break");
          }else{
            setMode("focus");
          }
          return;
        }

        render();
      }, 250);

      render();
    }

    // === Buttons ===
    document.getElementById("startPause").onclick = () => {
      if(timer) stopTimer();
      else startTimer();
    };

    // Stop: detiene y vuelve al inicio del bloque actual
    document.getElementById("stop").onclick = () => {
      stopTimer();
      remaining = total;
      render();
    };

    // Skip: pasa al siguiente bloque (cuenta foco como terminado si lo saltas)
    document.getElementById("skip").onclick = () => {
      stopTimer();
      if(mode === "focus"){
        pomoCount += 1;
        maybeCongrats();
        setMode("break");
      }else{
        setMode("focus");
      }
    };

    // Reset: vuelve TODO a 0 pomos y focus 35:00
    document.getElementById("reset").onclick = () => {
      stopTimer();
      pomoCount = 0;
      localStorage.removeItem(GOAL_CONGRATS_KEY);
      ringEl.style.boxShadow = "0 0 0 14px rgba(168,85,247,.12) inset";
      setMode("focus");
    };

    // === Goal input persistence ===
    function loadGoal(){
      const stored = Number(localStorage.getItem(GOAL_KEY));
      const goal = (Number.isFinite(stored) && stored > 0) ? stored : 8;
      goalInput.value = goal;
    }
    goalInput.addEventListener("change", () => {
      const g = Math.max(1, Math.min(30, Number(goalInput.value || 8)));
      goalInput.value = g;
      localStorage.setItem(GOAL_KEY, String(g));
      localStorage.removeItem(GOAL_CONGRATS_KEY);
      ringEl.style.boxShadow = "0 0 0 14px rgba(168,85,247,.12) inset";
      render();
    });

    // init
    loadGoal();
    setMode("focus");
    render();
  </script>
</body>
</html>
