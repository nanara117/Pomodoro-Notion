<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Notion Pomodoro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#0b0b12;
      --panel:#10101a;
      --text:#f4f4fa;
      --muted:#a1a1b3;
      --accent:#a855f7;
      --accent2:#7c3aed;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display:grid;
      place-items:center;
      height:100vh;
    }

    .app{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:24px;
    }

    .ring{
      width:320px;
      height:320px;
      border-radius:50%;
      background:
        conic-gradient(var(--accent) calc(var(--progress) * 1turn),
        rgba(255,255,255,.08) 0);
      display:grid;
      place-items:center;
      box-shadow: 0 0 0 12px rgba(168,85,247,.15) inset;
    }

    .inner{
      width:270px;
      height:270px;
      border-radius:50%;
      background:var(--panel);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .time{
      font-size:64px;
      font-weight:700;
      letter-spacing:.5px;
    }

    .sub{
      margin-top:8px;
      color:var(--muted);
      font-size:14px;
    }

    .controls{
      display:flex;
      gap:16px;
    }

    button{
      background:var(--panel);
      border:1px solid rgba(255,255,255,.1);
      color:var(--text);
      padding:10px 18px;
      border-radius:12px;
      cursor:pointer;
      font-size:14px;
    }

    button.primary{
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      border:none;
    }

    button:hover{
      opacity:.9;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="ring" id="ring" style="--progress:0">
      <div class="inner">
        <div class="time" id="time">25:00</div>
        <div class="sub">(1 / 6)</div>
      </div>
    </div>

    <div class="controls">
      <button id="reset">Reset</button>
      <button class="primary" id="start">Start</button>
    </div>
  </div>

  <script>
    const TOTAL = 25 * 60;
    let remaining = TOTAL;
    let timer = null;

    const timeEl = document.getElementById("time");
    const ring = document.getElementById("ring");

    function render(){
      const m = Math.floor(remaining / 60).toString().padStart(2,"0");
      const s = (remaining % 60).toString().padStart(2,"0");
      timeEl.textContent = `${m}:${s}`;
      ring.style.setProperty("--progress", 1 - remaining / TOTAL);
    }

    document.getElementById("start").onclick = () => {
      if(timer) return;
      timer = setInterval(() => {
        remaining--;
        if(remaining <= 0){
          clearInterval(timer);
          timer = null;
        }
        render();
      }, 1000);
    };

    document.getElementById("reset").onclick = () => {
      clearInterval(timer);
      timer = null;
      remaining = TOTAL;
      render();
    };

    render();
  </script>
</body>
</html>
