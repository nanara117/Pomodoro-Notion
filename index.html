<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Notion Pomodoro</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg:#FBF8FF;

  --accent:#A855F7;
  --accent2:#C084FC;

  --ringTrack:rgba(168,85,247,.18);

  /* Petals */
  --petal:#FFC7F8;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body{
  background:
    radial-gradient(900px 560px at 20% 22%, rgba(168,85,247,.30), transparent 62%),
    radial-gradient(980px 640px at 80% 30%, rgba(192,132,252,.26), transparent 66%),
    linear-gradient(180deg, rgba(168,85,247,.10), transparent 52%),
    var(--bg);
  display:grid;
  place-items:center;
}

/* Petals layer */
.petal-layer{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
  overflow:hidden;
}

.petal{
  position:absolute;
  top:-70px;
  width:34px;
  height:22px;
  background:var(--petal);
  border-radius:999px;
  opacity:.95;
  filter: drop-shadow(0 14px 26px rgba(168,85,247,.30));
  animation:
    fall var(--dur) linear forwards,
    sway var(--sway) ease-in-out infinite;
  will-change: transform, opacity;
}

.petal::after{
  content:"";
  position:absolute;
  inset:4px;
  background:rgba(255,255,255,.28);
  border-radius:999px;
}

@keyframes fall{
  to{
    transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot));
    opacity:0;
  }
}
@keyframes sway{
  0%,100%{ margin-left: 0; }
  50%{ margin-left: 18px; }
}

/* App */
.app{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  padding:18px;
  width:min(980px, 100%);
}

.top{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}

.pill{
  background:rgba(255,255,255,.90);
  border:1px solid rgba(168,85,247,.16);
  border-radius:14px;
  padding:10px 14px;
  font-size:13px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  display:flex;
  align-items:center;
  gap:8px;
}

.pill b{font-weight:800}

.pill input{
  width:64px;
  border:none;
  outline:none;
  background:rgba(168,85,247,.10);
  border-radius:10px;
  padding:6px 8px;
  text-align:center;
  font-weight:700;
  color:#2b2b2b;
}

.pill input.small{ width:54px; }

.pill input:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.ring{
  width:320px;
  height:320px;
  border-radius:50%;
  background:
    conic-gradient(var(--accent) calc(var(--progress)*1turn), var(--ringTrack) 0);
  display:grid;
  place-items:center;
}

.inner{
  width:260px;
  height:260px;
  border-radius:50%;
  background:rgba(255,255,255,.96);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 20px 50px rgba(0,0,0,.10);
  text-align:center;
  padding:14px;
}

.time{
  font-size:64px;
  font-weight:900;
  letter-spacing:.5px;
  line-height:1;
}

.sub{
  font-size:13px;
  opacity:.60;
  margin-top:10px;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}

button{
  padding:10px 16px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  background:white;
  box-shadow:0 10px 30px rgba(0,0,0,.10);
  font-weight:700;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
}

.hint{
  font-size:12px;
  opacity:.65;
  text-align:center;
  max-width:520px;
}

@media (max-width:460px){
  .ring{ width:300px; height:300px; }
  .inner{ width:244px; height:244px; }
  .time{ font-size:58px; }
}
</style>
</head>

<body>
  <!-- Petals -->
  <div class="petal-layer" id="petalLayer"></div>

  <!-- App -->
  <div class="app">
    <div class="top">
      <div class="pill">
        <b id="modeLabel">Focus</b>
        <span id="planLabel">• editable schedule</span>
      </div>

      <div class="pill">
        Goal (min)
        <input id="goalMin" type="number" min="10" max="1200" value="240" />
      </div>

      <div class="pill">
        Focused today:
        <b id="focusedLabel">0</b>
        <span>/</span>
        <b id="goalLabel">240</b>
        <span>min</span>
      </div>
    </div>

    <div class="top">
      <div class="pill">
        Focus
        <input id="focusMin" type="number" min="5" max="240" value="35" /> min
      </div>

      <div class="pill">
        Break
        <input id="shortBreakMin" type="number" min="1" max="90" value="10" /> min
      </div>

      <div class="pill">
        Long
        <input id="longBreakMin" type="number" min="5" max="180" value="30" /> min
      </div>

      <div class="pill">
        Every
        <input id="longEvery" class="small" type="number" min="2" max="12" value="5" />
        pomos
      </div>
    </div>

    <div class="ring" id="ring" style="--progress:0">
      <div class="inner">
        <div class="time" id="time">35:00</div>
        <div class="sub" id="sub">(next break: 10m)</div>
      </div>
    </div>

    <div class="controls">
      <button class="primary" id="start">Start</button>
      <button id="pause">Pause</button>
      <button id="stop">Stop</button>
      <button id="skip">Skip</button>
      <button id="reset">Reset</button>
    </div>

    <div class="hint">
      Pétalos + sonido solo mientras corre. Skip en Focus cuenta como bloque completado (para minutos y para el ciclo de long break).
    </div>
  </div>

<script>
/* =========================
   State + Elements
========================= */
let mode = "focus";         // "focus" | "break"
let pomos = 0;              // completed focus blocks (for long-break schedule)
let total = 35 * 60;        // current block total seconds
let remaining = total;      // current block remaining seconds

let timer = null;
let lastTick = null;

let focusedSecondsToday = 0; // daily progress in seconds

const ring = document.getElementById("ring");
const timeEl = document.getElementById("time");
const subEl = document.getElementById("sub");
const modeLabel = document.getElementById("modeLabel");
const planLabel = document.getElementById("planLabel");

const focusedLabel = document.getElementById("focusedLabel");
const goalLabel = document.getElementById("goalLabel");

const goalMinInput = document.getElementById("goalMin");
const focusInput = document.getElementById("focusMin");
const shortBreakInput = document.getElementById("shortBreakMin");
const longBreakInput = document.getElementById("longBreakMin");
const longEveryInput = document.getElementById("longEvery");

const btnStart = document.getElementById("start");
const btnPause = document.getElementById("pause");
const btnStop  = document.getElementById("stop");
const btnSkip  = document.getElementById("skip");
const btnReset = document.getElementById("reset");

/* =========================
   Helpers (inputs)
========================= */
function clampNum(v, min, max, fallback){
  const n = Number(v);
  if(!Number.isFinite(n)) return fallback;
  return Math.max(min, Math.min(max, n));
}

function goalMinutes(){
  return clampNum(goalMinInput.value, 10, 1200, 240);
}
function focusMinutes(){
  return clampNum(focusInput.value, 5, 240, 35);
}
function shortBreakMinutes(){
  return clampNum(shortBreakInput.value, 1, 90, 10);
}
function longBreakMinutes(){
  return clampNum(longBreakInput.value, 5, 180, 30);
}
function longEvery(){
  return clampNum(longEveryInput.value, 2, 12, 5);
}

/* =========================
   Web Audio (code only)
   (volume boosted)
========================= */
let audioCtx = null;

function ensureAudio(){
  if(audioCtx) return true;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return true;
  }catch(e){
    return false;
  }
}

function unlockAudioOnUserGesture(){
  ensureAudio();
  audioCtx?.resume?.().catch(()=>{});
}

function playTick(){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(523.25, t0); // C5

  // louder than before
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.16, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(t0);
  osc.stop(t0 + 0.16);
}

function playChime(){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime;

  // Master gain (boosted)
  const master = audioCtx.createGain();
  master.gain.setValueAtTime(0.0001, t0);
  master.gain.exponentialRampToValueAtTime(0.32, t0 + 0.02);   // louder
  master.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.25);
  master.connect(audioCtx.destination);

  // Slightly richer: 3 notes
  const freqs = [659.25, 880.00, 987.77]; // E5, A5, B5
  freqs.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(f, t0);

    const start = t0 + i * 0.06;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.60, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.90);

    osc.connect(gain);
    gain.connect(master);

    osc.start(start);
    osc.stop(start + 0.95);
  });
}

/* =========================
   Petal rain (constant while running)
========================= */
let petalInterval = null;

function spawnPetal(){
  const layer = document.getElementById("petalLayer");
  if(!layer) return;

  const p = document.createElement("div");
  p.className = "petal";

  const x = Math.random() * window.innerWidth;
  p.style.left = x + "px";

  const dx = (Math.random() * 280 - 140);      // wider spread
  const rot = (Math.random() * 720 - 360);

  const dur = (Math.random() * 2.2 + 4.0).toFixed(2) + "s";  // 4.0–6.2s
  const sway = (Math.random() * 1.3 + 1.0).toFixed(2) + "s";

  const scale = (Math.random() * 0.9 + 0.95).toFixed(2);     // 0.95–1.85
  p.style.transform = `scale(${scale})`;

  p.style.setProperty("--dx", dx + "px");
  p.style.setProperty("--rot", rot + "deg");
  p.style.setProperty("--dur", dur);
  p.style.setProperty("--sway", sway);

  layer.appendChild(p);
  setTimeout(() => p.remove(), 9000);
}

function startPetals(){
  if(petalInterval) return;
  for(let i=0;i<10;i++) spawnPetal();
  petalInterval = setInterval(spawnPetal, 240); // a bit denser
}

function stopPetals(){
  clearInterval(petalInterval);
  petalInterval = null;
}

/* =========================
   Rendering + Mode logic
========================= */
function fmt(sec){
  const m = Math.floor(sec/60).toString().padStart(2,"0");
  const s = Math.floor(sec%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

function nextBreakMins(nextPomo){
  return (nextPomo % longEvery() === 0) ? longBreakMinutes() : shortBreakMinutes();
}

function setMode(newMode){
  mode = newMode;

  if(mode === "focus"){
    total = focusMinutes() * 60;
    remaining = total;
    modeLabel.textContent = "Focus";
    subEl.textContent = `(next break: ${nextBreakMins(pomos + 1)}m)`;
  }else{
    const isLong = (pomos % longEvery() === 0 && pomos !== 0);
    const mins = isLong ? longBreakMinutes() : shortBreakMinutes();
    total = mins * 60;
    remaining = total;
    modeLabel.textContent = isLong ? "Long Break" : "Break";
    subEl.textContent = `(next focus: ${focusMinutes()}m)`;
  }

  planLabel.textContent = `• ${focusMinutes()}/${shortBreakMinutes()} (long ${longBreakMinutes()} every ${longEvery()})`;
  render();
}

function render(){
  timeEl.textContent = fmt(remaining);

  const progress = 1 - (remaining / total);
  ring.style.setProperty("--progress", Math.max(0, Math.min(1, progress)));

  const focusedMin = Math.floor(focusedSecondsToday / 60);
  focusedLabel.textContent = String(focusedMin);

  const g = goalMinutes();
  goalLabel.textContent = String(g);

  // lock settings while running
  const running = !!timer;
  focusInput.disabled = running;
  shortBreakInput.disabled = running;
  longBreakInput.disabled = running;
  longEveryInput.disabled = running;
  goalMinInput.disabled = running;

  btnStart.disabled = running;
  btnPause.disabled = !running;
}

/* =========================
   Timer controls
========================= */
function startTimer(){
  if(timer) return;

  unlockAudioOnUserGesture();
  playTick();
  startPetals();

  lastTick = Date.now();
  timer = setInterval(() => {
    const now = Date.now();
    const delta = Math.floor((now - lastTick) / 1000);

    if(delta >= 1){
      remaining -= delta;
      lastTick += delta * 1000;
    }

    if(remaining <= 0){
      remaining = 0;
      render();

      playChime();

      // stop this block
      clearInterval(timer);
      timer = null;
      lastTick = null;

      // If finished a focus block, add minutes toward daily goal
      if(mode === "focus"){
        focusedSecondsToday += focusMinutes() * 60;
        pomos += 1;
        setMode("break");
      }else{
        setMode("focus");
      }

      // petals only while actively running
      stopPetals();
      render();
      return;
    }

    render();
  }, 250);

  render();
}

function pauseTimer(){
  clearInterval(timer);
  timer = null;
  lastTick = null;
  stopPetals();
  render();
}

function stopToBlockStart(){
  pauseTimer();
  remaining = total;
  render();
}

/* =========================
   Buttons
========================= */
btnStart.onclick = startTimer;

btnPause.onclick = () => {
  unlockAudioOnUserGesture();
  pauseTimer();
};

btnStop.onclick = () => {
  unlockAudioOnUserGesture();
  stopToBlockStart();
};

// Skip: advance to next block
// - If skipping focus, count it as completed focus (minutes + pomos)
btnSkip.onclick = () => {
  unlockAudioOnUserGesture();
  pauseTimer();

  if(mode === "focus"){
    focusedSecondsToday += focusMinutes() * 60;
    pomos += 1;
    setMode("break");
  }else{
    setMode("focus");
  }
};

btnReset.onclick = () => {
  unlockAudioOnUserGesture();
  pauseTimer();
  focusedSecondsToday = 0;
  pomos = 0;
  setMode("focus");
};

// If user changes values while not running, update labels + sub text
[goalMinInput, focusInput, shortBreakInput, longBreakInput, longEveryInput].forEach(el => {
  el.addEventListener("change", () => {
    // normalize clamps visually
    goalMinInput.value = goalMinutes();
    focusInput.value = focusMinutes();
    shortBreakInput.value = shortBreakMinutes();
    longBreakInput.value = longBreakMinutes();
    longEveryInput.value = longEvery();

    // refresh texts depending on current mode
    if(mode === "focus"){
      subEl.textContent = `(next break: ${nextBreakMins(pomos + 1)}m)`;
    }else{
      subEl.textContent = `(next focus: ${focusMinutes()}m)`;
    }
    planLabel.textContent = `• ${focusMinutes()}/${shortBreakMinutes()} (long ${longBreakMinutes()} every ${longEvery()})`;
    render();
  });
});

/* =========================
   Init
========================= */
setMode("focus");
render();
</script>

</body>
</html>
