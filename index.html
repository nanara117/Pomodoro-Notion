<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Notion Pomodoro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#FBF8FF;
  --accent:#A855F7;
  --accent2:#C084FC;

  --petal:#FFC7F8;
  --center:#9D7BEA; /* centro suave, no oscuro */

  --ringTrack:rgba(168,85,247,.18);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  background:
    radial-gradient(800px 500px at 20% 20%, rgba(168,85,247,.28), transparent 60%),
    radial-gradient(900px 600px at 80% 30%, rgba(192,132,252,.25), transparent 65%),
    linear-gradient(180deg, rgba(168,85,247,.08), transparent 50%),
    var(--bg);
  display:grid;
  place-items:center;
}

/* ===== BACKGROUND FLOWERS ===== */
.daisy-layer{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

.daisy{
  position:absolute;
  width:90px;
  height:90px;
  opacity:.45;
  filter: drop-shadow(0 10px 20px rgba(168,85,247,.15));
}

.daisy .petals{ fill:var(--petal); }
.daisy .center{ fill:var(--center); }

.d1{top:40px;left:60px}
.d2{top:140px;right:120px}
.d3{top:260px;left:180px;opacity:.35}
.d4{bottom:200px;right:90px}
.d5{bottom:120px;left:140px}
.d6{bottom:60px;right:220px;opacity:.3}

@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
  100%{transform:translateY(0)}
}

body.running .daisy{
  animation:float 5s ease-in-out infinite;
}

/* ===== PETALS ===== */
.petal-layer{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
}

.petal{
  position:absolute;
  top:-70px;
  width:34px;
  height:22px;
  background:var(--petal);
  border-radius:999px;
  opacity:.95;
  filter: drop-shadow(0 14px 26px rgba(168,85,247,.28));
  animation:
    fall var(--dur) linear forwards,
    sway var(--sway) ease-in-out infinite;
}
.petal::after{
  content:"";
  position:absolute;
  inset:4px;
  background:rgba(255,255,255,.28);
  border-radius:999px;
}

@keyframes fall{
  to{
    transform:translate3d(var(--dx),110vh,0) rotate(var(--rot));
    opacity:0;
  }
}

@keyframes sway{
  50%{margin-left:14px}
}

/* ===== APP ===== */
.app{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}

.top{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  justify-content:center;
}

.pill{
  background:rgba(255,255,255,.9);
  border-radius:14px;
  padding:10px 14px;
  font-size:13px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.goal input{
  width:50px;
  border:none;
  background:rgba(0,0,0,.05);
  border-radius:8px;
  padding:4px;
  text-align:center;
}

.ring{
  width:320px;
  height:320px;
  border-radius:50%;
  background:
    conic-gradient(var(--accent) calc(var(--progress)*1turn), var(--ringTrack) 0);
  display:grid;
  place-items:center;
}

.inner{
  width:260px;
  height:260px;
  border-radius:50%;
  background:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 20px 50px rgba(0,0,0,.1);
}

.time{
  font-size:64px;
  font-weight:800;
}

.sub{
  font-size:13px;
  opacity:.6;
}

.controls{
  display:flex;
  gap:10px;
}

button{
  padding:10px 16px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  background:white;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
}
</style>
</head>

<body>

<!-- FLOWERS -->
<div class="daisy-layer">
  <!-- Daisy 1 -->
  <svg class="daisy d1" viewBox="0 0 100 100">
    <g class="petals">
      <ellipse cx="50" cy="15" rx="20" ry="30"/>
      <ellipse cx="85" cy="50" rx="30" ry="20"/>
      <ellipse cx="50" cy="85" rx="20" ry="30"/>
      <ellipse cx="15" cy="50" rx="30" ry="20"/>
    </g>
    <circle cx="50" cy="50" r="16" class="center"/>
  </svg>

  <!-- Daisy 2 -->
  <svg class="daisy d2" viewBox="0 0 100 100">
    <g class="petals">
      <ellipse cx="50" cy="15" rx="20" ry="30"/>
      <ellipse cx="85" cy="50" rx="30" ry="20"/>
      <ellipse cx="50" cy="85" rx="20" ry="30"/>
      <ellipse cx="15" cy="50" rx="30" ry="20"/>
    </g>
    <circle cx="50" cy="50" r="16" class="center"/>
  </svg>

  <!-- Daisy 3 -->
  <svg class="daisy d3" viewBox="0 0 100 100">
    <g class="petals">
      <ellipse cx="50" cy="15" rx="20" ry="30"/>
      <ellipse cx="85" cy="50" rx="30" ry="20"/>
      <ellipse cx="50" cy="85" rx="20" ry="30"/>
      <ellipse cx="15" cy="50" rx="30" ry="20"/>
    </g>
    <circle cx="50" cy="50" r="16" class="center"/>
  </svg>

  <!-- Daisy 4 -->
  <svg class="daisy d4" viewBox="0 0 100 100">
    <g class="petals">
      <ellipse cx="50" cy="15" rx="20" ry="30"/>
      <ellipse cx="85" cy="50" rx="30" ry="20"/>
      <ellipse cx="50" cy="85" rx="20" ry="30"/>
      <ellipse cx="15" cy="50" rx="30" ry="20"/>
    </g>
    <circle cx="50" cy="50" r="16" class="center"/>
  </svg>

  <!-- Daisy 5 -->
  <svg class="daisy d5" viewBox="0 0 100 100">
    <g class="petals">
      <ellipse cx="50" cy="15" rx="20" ry="30"/>
      <ellipse cx="85" cy="50" rx="30" ry="20"/>
      <ellipse cx="50" cy="85" rx="20" ry="30"/>
      <ellipse cx="15" cy="50" rx="30" ry="20"/>
    </g>
    <circle cx="50" cy="50" r="16" class="center"/>
  </svg>

  <!-- Daisy 6 -->
  <svg class="daisy d6" viewBox="0 0 100 100">
    <g class="petals">
      <ellipse cx="50" cy="15" rx="20" ry="30"/>
      <ellipse cx="85" cy="50" rx="30" ry="20"/>
      <ellipse cx="50" cy="85" rx="20" ry="30"/>
      <ellipse cx="15" cy="50" rx="30" ry="20"/>
    </g>
    <circle cx="50" cy="50" r="16" class="center"/>
  </svg>
</div>

<!-- APP -->
<div class="app">
  <div class="top">
    <div class="pill">Focus 35 / 10 (long 30 every 5)</div>
    <div class="pill goal">Goal <input id="goal" type="number" value="8"> pomos</div>
    <div class="pill" id="count">Pomodoros: 0 / 8</div>
  </div>

  <div class="ring" id="ring">
    <div class="inner">
      <div class="time" id="time">35:00</div>
      <div class="sub">(next break: 10m)</div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="start">Start</button>
    <button id="stop">Stop</button>
    <button id="reset">Reset</button>
  </div>
</div>

<script>
/* ===== TIMER ===== */
let total = 35*60;
let remaining = total;
let timer = null;
let pomos = 0;

const timeEl = document.getElementById("time");
const ring = document.getElementById("ring");
const count = document.getElementById("count");
const goalInput = document.getElementById("goal");

/* ===== PETALS ===== */
let petalInterval=null;

function spawnPetal(){
  const layer=document.getElementById("petalLayer");
  const p=document.createElement("div");
  p.className="petal";
  p.style.left=Math.random()*innerWidth+"px";
  p.style.setProperty("--dx",(Math.random()*200-100)+"px");
  p.style.setProperty("--rot",(Math.random()*720-360)+"deg");
  p.style.setProperty("--dur",(Math.random()*2+4)+"s");
  p.style.setProperty("--sway",(Math.random()*1+1)+"s");
  layer.appendChild(p);
  setTimeout(()=>p.remove(),9000);
}

function startPetals(){
  if(petalInterval) return;
  petalInterval=setInterval(spawnPetal,400);
}

function stopPetals(){
  clearInterval(petalInterval);
  petalInterval=null;
}

/* ===== CONTROLS ===== */
function render(){
  const m=Math.floor(remaining/60).toString().padStart(2,"0");
  const s=(remaining%60).toString().padStart(2,"0");
  timeEl.textContent=`${m}:${s}`;
  ring.style.setProperty("--progress",1-remaining/total);
  count.textContent=`Pomodoros: ${pomos} / ${goalInput.value}`;
}

document.getElementById("start").onclick=()=>{
  if(timer) return;
  document.body.classList.add("running");
  startPetals();
  timer=setInterval(()=>{
    remaining--;
    if(remaining<=0){
      clearInterval(timer);
      timer=null;
      pomos++;
      remaining=total;
      stopPetals();
      document.body.classList.remove("running");
    }
    render();
  },1000);
};

document.getElementById("stop").onclick=()=>{
  clearInterval(timer);
  timer=null;
  stopPetals();
  document.body.classList.remove("running");
};

document.getElementById("reset").onclick=()=>{
  clearInterval(timer);
  timer=null;
  remaining=total;
  pomos=0;
  stopPetals();
  document.body.classList.remove("running");
  render();
};

render();
</script>

</body>
</html>
