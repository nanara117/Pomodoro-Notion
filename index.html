<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Notion Pomodoro</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg:#FBF8FF;

  --accent:#A855F7;
  --accent2:#C084FC;

  --ringTrack:rgba(168,85,247,.18);

  /* Petals */
  --petal:#FFC7F8;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body{
  background:
    radial-gradient(900px 560px at 20% 22%, rgba(168,85,247,.30), transparent 62%),
    radial-gradient(980px 640px at 80% 30%, rgba(192,132,252,.26), transparent 66%),
    linear-gradient(180deg, rgba(168,85,247,.10), transparent 52%),
    var(--bg);
  display:grid;
  place-items:center;
}

/* Petals layer */
.petal-layer{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
  overflow:hidden;
}

.petal{
  position:absolute;
  top:-70px;
  width:34px;
  height:22px;
  background:var(--petal);
  border-radius:999px;
  opacity:.95;
  filter: drop-shadow(0 14px 26px rgba(168,85,247,.28));
  animation:
    fall var(--dur) linear forwards,
    sway var(--sway) ease-in-out infinite;
  will-change: transform, opacity;
}

.petal::after{
  content:"";
  position:absolute;
  inset:4px;
  background:rgba(255,255,255,.28);
  border-radius:999px;
}

@keyframes fall{
  to{
    transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot));
    opacity:0;
  }
}
@keyframes sway{
  0%,100%{ margin-left: 0; }
  50%{ margin-left: 18px; }
}

/* App */
.app{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  padding:18px;
}

.top{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
}

.pill{
  background:rgba(255,255,255,.90);
  border:1px solid rgba(168,85,247,.16);
  border-radius:14px;
  padding:10px 14px;
  font-size:13px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.goal input{
  width:56px;
  border:none;
  outline:none;
  background:rgba(168,85,247,.10);
  border-radius:10px;
  padding:6px 8px;
  text-align:center;
  font-weight:600;
}

.ring{
  width:320px;
  height:320px;
  border-radius:50%;
  background:
    conic-gradient(var(--accent) calc(var(--progress)*1turn), var(--ringTrack) 0);
  display:grid;
  place-items:center;
}

.inner{
  width:260px;
  height:260px;
  border-radius:50%;
  background:rgba(255,255,255,.96);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 20px 50px rgba(0,0,0,.10);
}

.time{
  font-size:64px;
  font-weight:800;
  letter-spacing:.5px;
}
.sub{
  font-size:13px;
  opacity:.60;
  margin-top:8px;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}

button{
  padding:10px 16px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  background:white;
  box-shadow:0 10px 30px rgba(0,0,0,.10);
  font-weight:600;
}

.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
}

@media (max-width:460px){
  .ring{ width:300px; height:300px; }
  .inner{ width:244px; height:244px; }
  .time{ font-size:58px; }
}
</style>
</head>

<body>
  <!-- Petals -->
  <div class="petal-layer" id="petalLayer"></div>

  <!-- App -->
  <div class="app">
    <div class="top">
      <div class="pill" id="plan">Focus 35 / break 10 (long 30 every 5)</div>
      <div class="pill goal">Goal <input id="goal" type="number" min="1" max="30" value="8" /> pomos</div>
      <div class="pill" id="count">Pomodoros: 0 / 8</div>
    </div>

    <div class="ring" id="ring" style="--progress:0">
      <div class="inner">
        <div class="time" id="time">35:00</div>
        <div class="sub" id="sub">(next break: 10m)</div>
      </div>
    </div>

    <div class="controls">
      <button class="primary" id="start">Start</button>
      <button id="pause">Pause</button>
      <button id="stop">Stop</button>
      <button id="skip">Skip</button>
      <button id="reset">Reset</button>
    </div>
  </div>

<script>
/* ===== Pomodoro config ===== */
const FOCUS_MIN = 35;
const SHORT_BREAK_MIN = 10;
const LONG_BREAK_MIN = 30;
const LONG_EVERY = 5;

/* ===== State ===== */
let mode = "focus";         // "focus" | "break"
let pomos = 0;              // completed focus blocks
let total = FOCUS_MIN * 60;
let remaining = total;

let timer = null;
let lastTick = null;

/* ===== Petal rain ===== */
let petalInterval = null;

function spawnPetal(){
  const layer = document.getElementById("petalLayer");
  if(!layer) return;

  const p = document.createElement("div");
  p.className = "petal";

  const x = Math.random() * window.innerWidth;
  p.style.left = x + "px";

  const dx = (Math.random() * 260 - 130);      // wider spread
  const rot = (Math.random() * 720 - 360);

  const dur = (Math.random() * 2.2 + 4.2).toFixed(2) + "s";  // 4.2–6.4s
  const sway = (Math.random() * 1.3 + 1.0).toFixed(2) + "s";

  const scale = (Math.random() * 0.9 + 0.9).toFixed(2);      // 0.9–1.8
  p.style.transform = `scale(${scale})`;

  p.style.setProperty("--dx", dx + "px");
  p.style.setProperty("--rot", rot + "deg");
  p.style.setProperty("--dur", dur);
  p.style.setProperty("--sway", sway);

  layer.appendChild(p);
  setTimeout(() => p.remove(), 9000);
}

function startPetals(){
  if(petalInterval) return;
  for(let i=0;i<10;i++) spawnPetal();          // instant "cute" presence
  petalInterval = setInterval(spawnPetal, 260); // density
}

function stopPetals(){
  clearInterval(petalInterval);
  petalInterval = null;
}

/* ===== UI ===== */
const ring = document.getElementById("ring");
const timeEl = document.getElementById("time");
const subEl = document.getElementById("sub");
const countEl = document.getElementById("count");
const goalInput = document.getElementById("goal");

function fmt(sec){
  const m = Math.floor(sec/60).toString().padStart(2,"0");
  const s = Math.floor(sec%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

function currentGoal(){
  const g = Number(goalInput.value || 8);
  return (Number.isFinite(g) && g > 0) ? g : 8;
}

function nextBreakMins(nextPomo){
  return (nextPomo % LONG_EVERY === 0) ? LONG_BREAK_MIN : SHORT_BREAK_MIN;
}

function setMode(newMode){
  mode = newMode;

  if(mode === "focus"){
    total = FOCUS_MIN * 60;
    remaining = total;
    subEl.textContent = `(next break: ${nextBreakMins(pomos + 1)}m)`;
  }else{
    const mins = (pomos % LONG_EVERY === 0 && pomos !== 0) ? LONG_BREAK_MIN : SHORT_BREAK_MIN;
    total = mins * 60;
    remaining = total;
    subEl.textContent = `(next focus: ${FOCUS_MIN}m)`;
  }

  render();
}

function render(){
  timeEl.textContent = fmt(remaining);
  const progress = 1 - (remaining / total);
  ring.style.setProperty("--progress", Math.max(0, Math.min(1, progress)));
  countEl.textContent = `Pomodoros: ${pomos} / ${currentGoal()}`;
}

function startTimer(){
  if(timer) return;
  startPetals();

  lastTick = Date.now();
  timer = setInterval(() => {
    const now = Date.now();
    const delta = Math.floor((now - lastTick) / 1000);
    if(delta >= 1){
      remaining -= delta;
      lastTick += delta * 1000;
    }

    if(remaining <= 0){
      remaining = 0;
      render();

      // auto-advance
      clearInterval(timer);
      timer = null;

      if(mode === "focus"){
        pomos += 1;
        setMode("break");
      }else{
        setMode("focus");
      }

      // keep petals going only if we immediately continue running.
      // We stop them because you asked: petals run while timer runs.
      stopPetals();
      return;
    }

    render();
  }, 250);

  render();
}

function pauseTimer(){
  clearInterval(timer);
  timer = null;
  lastTick = null;
  stopPetals();
  render();
}

function stopToBlockStart(){
  pauseTimer();
  remaining = total;
  render();
}

/* ===== Buttons ===== */
document.getElementById("start").onclick = startTimer;
document.getElementById("pause").onclick = pauseTimer;

document.getElementById("stop").onclick = () => {
  stopToBlockStart();
};

document.getElementById("skip").onclick = () => {
  // Skip current block as completed (focus counts, break doesn't)
  pauseTimer();
  if(mode === "focus") pomos += 1;
  setMode(mode === "focus" ? "break" : "focus");
};

document.getElementById("reset").onclick = () => {
  pauseTimer();
  pomos = 0;
  setMode("focus");
};

goalInput.addEventListener("change", () => {
  // re-render count display
  render();
});

/* init */
setMode("focus");
render();
</script>
</body>
</html>
